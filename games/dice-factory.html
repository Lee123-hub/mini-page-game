<script>
'use strict';
const Factory=(()=>{
 const research=[
 ['magnet','磁力轨道','回收 +20% / 级',3,5],['cool','冷却鳍片','散热 +20% / 级',3,5],['echo','同点回响','同点奖励 +25% / 级',4,5],
 ['storage','折叠堆场','堆场 +20% / 级',4,5],['lens','精密透镜','骰面收益 +10% / 级',5,5],['charge','电容阵列','共振充能 +15% / 级',5,5],
 ['straight','序列协议','解锁顺子配置',8,1],['recycle','回收协议','解锁回收配置',8,1],['press','高压模具','压缩费用 −6% / 级',6,5],
 ['clock','同步时钟','投掷周期 −4% / 级',7,5],['auto','无人值守','自动共振；热量 <30 启动',14,1],['seed','启动套件','每代开局 +60 碎晶 / 级',8,5]
 ];
 const fresh=(now=Date.now())=>({version:2,money:0,pile:0,count:1,value:0,speed:0,carry:0,store:0,cooler:0,heat:0,energy:0,cores:0,coreTotal:0,gen:1,produced:0,collected:0,lifetime:0,pairs:0,presses:0,rolls:0,orders:0,orderBase:0,research:{},mode:'balanced',seconds:0,runSeconds:0,savedAt:now,low:false,legacy:false});
 const level=(state,key)=>state.research[key]||0;
 const cap=state=>(120+state.store*100)*(1+.2*level(state,'storage'));
 const factor=state=>(1+.22*state.value)*(1+.1*level(state,'lens'));
 const period=state=>Math.max(1.1,(4.8-.22*Math.max(0,state.speed-1))*(1-.04*level(state,'clock')));
 const carry=state=>(1.1+.65*state.carry)*(1+.2*level(state,'magnet'))*(state.mode==='recycle'?1.5:1);
 const cooling=state=>(3+.45*state.cooler)*(1+.2*level(state,'cool'));
 const pressCost=state=>Math.round((90+state.presses*20)*(1-.06*level(state,'press')));
 const cost=(state,key)=>{const bases={count:40,value:30,speed:100,carry:25,store:65,cooler:85},growth={count:2.8,value:1.36,speed:1.75,carry:1.38,store:1.52,cooler:1.5},limits={count:6,value:30,speed:12,carry:30,store:20,cooler:20};if(!(key in bases)||state[key]>=limits[key])return Infinity;return Math.ceil(bases[key]*growth[key]**(state[key]-(key==='count'?1:0)));};
 function buy(state,key){const price=cost(state,key);if(!Number.isFinite(price)||state.money<price)return false;state.money-=price;state[key]++;return true;}
 function outcome(state,values){const counts=Array(6).fill(0);values.forEach(value=>counts[value-1]++);const pairs=counts.reduce((sum,count)=>sum+Math.floor(count/2),0);const unique=new Set(values).size;let bonus=pairs*3*(1+.25*level(state,'echo'))*(state.mode==='pairs'?1.7:1);if(state.mode==='straight'&&unique>=3){const sorted=[...new Set(values)].sort((left,right)=>left-right);let chain=1,best=1;for(let index=1;index<sorted.length;index++){chain=sorted[index]===sorted[index-1]+1?chain+1:1;best=Math.max(best,chain);}if(best>=3)bonus+=best*5;}const base=values.reduce((sum,value)=>sum+value,0)*(state.mode==='pairs'?.85:1);return {amount:(base+bonus)*factor(state)*(state.mode==='recycle'?.8:1),pairs,counts};}
 function deposit(state,amount){const accepted=Math.max(0,Math.min(amount,cap(state)-state.pile));state.pile+=accepted;state.produced+=accepted;state.lifetime+=accepted;return accepted;}
 function roll(state,random=Math.random,burst=false){const values=Array.from({length:state.count},()=>1+Math.floor(random()*6));const result=outcome(state,values);result.amount=deposit(state,result.amount*(burst?2:1));state.rolls++;state.pairs+=result.pairs;if(!burst)state.energy=Math.min(100,state.energy+(3+result.pairs*6)*(1+.15*level(state,'charge')));return {...result,values};}
 function tick(state,seconds,burst=false){state.seconds+=seconds;state.runSeconds+=seconds;const collected=Math.min(state.pile,carry(state)*seconds);state.pile-=collected;state.money+=collected;state.collected+=collected;state.heat=Math.max(0,Math.min(100,state.heat+seconds*(burst?12:-cooling(state))));return collected;}
 function compress(state){const price=pressCost(state);if(state.pile<price)return false;state.pile-=price;state.cores++;state.coreTotal++;state.presses++;return true;}
 function researchCost(state,index){const entry=research[index];return entry?entry[3]*(1+level(state,entry[0])):Infinity;}
 function study(state,index){const entry=research[index],price=researchCost(state,index);if(!entry||level(state,entry[0])>=entry[4]||state.cores<price)return false;state.cores-=price;state.research[entry[0]]=level(state,entry[0])+1;return true;}
 const metric=state=>[state.collected,state.pairs,state.presses,state.produced][state.orders%4];
 const orderTarget=state=>[120,12,2,450][state.orders%4]*(1+Math.floor(state.orders/4)*.6);
 function claim(state){if(metric(state)-state.orderBase<orderTarget(state))return false;const bonus=1+Math.floor(state.orders/8);state.cores+=bonus;state.coreTotal+=bonus;state.orders++;state.orderBase=metric(state);return true;}
 const rebirthReward=state=>Math.floor(Math.sqrt(state.collected/350));
 function rebirth(state){const reward=rebirthReward(state);if(reward<3)return null;const next=fresh();Object.assign(next,{cores:state.cores+reward,coreTotal:state.coreTotal+reward,gen:state.gen+1,research:{...state.research},seconds:state.seconds,lifetime:state.lifetime,low:state.low,legacy:state.legacy});next.money=level(next,'seed')*60;return next;}
 function validate(input,now=Date.now()){if(!input||input.version!==2)throw Error('版本无效');const result=fresh(now);const limits={money:1e15,pile:1e7,count:6,value:30,speed:12,carry:30,store:20,cooler:20,heat:100,energy:100,cores:1e8,coreTotal:1e9,gen:1e6,produced:1e15,collected:1e15,lifetime:1e15,pairs:1e12,presses:1e7,rolls:1e12,orders:1e7,orderBase:1e15,seconds:1e12,runSeconds:1e12,savedAt:now+300000};const ints=['count','value','speed','carry','store','cooler','cores','coreTotal','gen','pairs','presses','rolls','orders'];for(const [key,max]of Object.entries(limits)){const value=input[key];if(typeof value!=='number'||!Number.isFinite(value)||value<0||value>max||ints.includes(key)&&!Number.isInteger(value))throw Error('字段无效');result[key]=value;}if(result.count<1||result.gen<1||!input.research||typeof input.research!=='object')throw Error('存档无效');for(const entry of research){const value=input.research[entry[0]]===undefined?0:input.research[entry[0]];if(!Number.isInteger(value)||value<0||value>entry[4])throw Error('研究无效');if(value)result.research[entry[0]]=value;}if(!['balanced','pairs','straight','recycle'].includes(input.mode))throw Error('配置无效');if(input.mode==='straight'&&!level(result,'straight')||input.mode==='recycle'&&!level(result,'recycle'))throw Error('配置未解锁');result.mode=input.mode;result.low=input.low===true;result.legacy=input.legacy===true;if(result.pile>cap(result)+.001||result.cores>result.coreTotal||result.orderBase>metric(result)||result.collected>result.produced+.001)throw Error('进度无效');return result;}
 const expectationCache=new Map();
 function expected(state){const key=[state.count,state.mode,level(state,'echo')].join(':');if(!expectationCache.has(key)){const values=Array(state.count).fill(1);let sum=0;const base={...state,value:0,research:{echo:level(state,'echo')}};function walk(index){if(index===state.count){sum+=outcome(base,values).amount;return;}for(let value=1;value<=6;value++){values[index]=value;walk(index+1);}}walk(0);expectationCache.set(key,sum/6**state.count);}return expectationCache.get(key)*factor(state);}
 function offline(state,now=Date.now()){const seconds=Math.min(28800,Math.max(0,(now-state.savedAt)/1000));const income=state.speed?expected(state)/period(state):0;const collected=Math.min(state.pile+income*seconds,carry(state)*seconds);const endPile=Math.min(cap(state),Math.max(0,state.pile+income*seconds-collected));const produced=collected+endPile-state.pile;state.pile=endPile;state.produced+=Math.max(0,produced);state.lifetime+=Math.max(0,produced);state.money+=collected;state.collected+=collected;state.seconds+=seconds;state.runSeconds+=seconds;state.heat=Math.max(0,state.heat-cooling(state)*seconds);state.savedAt=now;return {seconds,amount:collected};}
 return {research,fresh,level,cap,factor,period,carry,cooling,pressCost,cost,buy,outcome,deposit,roll,tick,compress,researchCost,study,metric,orderTarget,claim,rebirthReward,rebirth,validate,expected,offline};
})();
</script>
<script>
(()=>{
 const $=id=>document.getElementById(id),storageKey='dice-factory-v2';let state=Factory.fresh(),blocked=false,tab='production',researchPage=0,helpPage=0;
 let migrationPending=false;let oldRaw=null;try{const raw=localStorage.getItem(storageKey);if(raw)state=Factory.validate(JSON.parse(raw));else oldRaw=localStorage.getItem('dice-engine-incremental-v1');}catch{blocked=true;}
 migrationPending=Boolean(oldRaw)&&!blocked;
 const offline=Factory.offline(state);let clock=performance.now(),cycle=0,lastManual=-1e6,lastBoost=-1e6,lastPaint=0,lastSave=clock,burstUntil=0,focusBefore=null,toastTimer,values=Array(state.count).fill(1),particles=[],floats=[],links=[],lastVisual=-1e6,token=0,visualTimer,paused=false;
 const session=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),canvas=$('fx');let ctx=null;try{ctx=canvas.getContext('2d');}catch{}let width=350,height=240;
 const light=()=>state.low||(typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches),active=()=>burstUntil>performance.now();
 const fmt=value=>value<1000?Math.floor(value).toLocaleString('zh-CN'):value<1e6?(value/1000).toFixed(1)+'K':(value/1e6).toFixed(1)+'M';
 function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
 function save(){state.savedAt=Date.now();if(blocked||paused||migrationPending)return;try{localStorage.setItem(storageKey,JSON.stringify({...state,session}));}catch{blocked=true;toast('存储不可用，请导出');}}
 function resize(){const rect=$('scene').getBoundingClientRect();width=rect.width;height=rect.height;const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=width*ratio;canvas.height=height*ratio;if(ctx)ctx.setTransform(ratio,0,0,ratio,0,0);}if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe($('scene'));else window.addEventListener('resize',resize);
 const positions=count=>count<=3?Array.from({length:count},(_,index)=>[(index+1)/(count+1),.5]):Array.from({length:count},(_,index)=>[(index%3+1)/4,index<3?.25:.8]);
 const dots={1:[[30,30]],2:[[15,15],[45,45]],3:[[15,15],[30,30],[45,45]],4:[[15,15],[45,15],[15,45],[45,45]],5:[[15,15],[45,15],[30,30],[15,45],[45,45]],6:[[15,15],[45,15],[15,30],[45,30],[15,45],[45,45]]};
 function drawDice(){const spots=positions(state.count);$('dice').innerHTML=spots.map(([left,top],index)=>`<div class="die" style="left:${left*100}%;top:${top*100}%"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">${dots[values[index]||1].map(([left,top])=>`<circle cx="${left}" cy="${top}" r="5.5"/>`).join('')}</svg></div>`).join('');}
 function visuals(result){if(performance.now()-lastVisual<500)return;lastVisual=performance.now();values=result.values;drawDice();const current=++token;const dice=[...$('dice').children];if(!light())dice.forEach((die,index)=>{if(die.animate)die.animate([{transform:'translate(-50%,-115%) rotate(90deg) scale(.8)'},{transform:'translate(-50%,-42%) rotate(-8deg)'},{transform:'translate(-50%,-50%) rotate(0)'}],{duration:330,delay:index*12});});clearTimeout(visualTimer);visualTimer=setTimeout(()=>{if(current!==token)return;const spots=positions(state.count);const groups=Array.from({length:6},()=>[]);values.forEach((value,index)=>groups[value-1].push(index));groups.filter(group=>group.length>1).forEach(group=>{group.forEach(index=>dice[index].classList.add('match'));for(let index=1;index<group.length;index++)links.push({from:spots[group[index-1]],to:spots[group[index]],life:0});});if(!light())spots.forEach(([left,top])=>{for(let index=0;index<5&&particles.length<100;index++)particles.push({left:width*(.08+left*.84),top:height*(.24+top*.43),target:width*(.2+Math.random()*.6),life:0});});floats.push({text:'+'+fmt(result.amount)+(result.pairs?' 同点':''),life:0});floats=floats.slice(-3);},light()?0:340);}
 function perform(){if(state.heat>=95){toast('过热 · 等待散热');return;}visuals(Factory.roll(state,Math.random,active()));}
 const info={count:['⚄','增加骰子',()=>`${state.count} → ${state.count+1} 颗`],value:['◇','骰面增幅',()=>`×${Factory.factor(state).toFixed(2)} → ×${Factory.factor({...state,value:state.value+1}).toFixed(2)}`],speed:['↯',()=>state.speed?'投掷加速':'自动投掷',()=>state.speed?`${Factory.period(state).toFixed(1)}s → ${Factory.period({...state,speed:state.speed+1}).toFixed(1)}s`:'每 4.8 秒 · 自动生产'],carry:['▰','搬运机',()=>`${Factory.carry(state).toFixed(1)} → ${Factory.carry({...state,carry:state.carry+1}).toFixed(1)} / 秒`],store:['▤','扩建堆场',()=>`${fmt(Factory.cap(state))} → ${fmt(Factory.cap({...state,store:state.store+1}))}`],cooler:['❄','散热装置',()=>`${Factory.cooling(state).toFixed(1)} → ${Factory.cooling({...state,cooler:state.cooler+1}).toFixed(1)} / 秒`]};
 function renderPanel(){if(tab==='production'||tab==='logistics'){$('panel').innerHTML=(tab==='production'?['count','value','speed']:['carry','store','cooler']).map(key=>{const entry=info[key],price=Factory.cost(state,key);return `<button class="upgrade" data-buy="${key}" ${paused||state.money<price?'disabled':''}><span class="symbol">${entry[0]}</span><span><strong>${typeof entry[1]==='function'?entry[1]():entry[1]}</strong><small>${Number.isFinite(price)?entry[2]():'已满级'}</small></span><span class="price">${Number.isFinite(price)?fmt(price):'MAX'}</span></button>`;}).join('');}
 else if(tab==='research'){const index=researchPage,entry=Factory.research[index],level=Factory.level(state,entry[0]),price=Factory.researchCost(state,index);$('panel').innerHTML=`<div class="panel-card"><div><b>研究室</b><small>◈ ${state.cores} 晶核</small></div><div class="pager"><button data-page="-1" aria-label="上一研究">‹</button>${index+1} / 12<button data-page="1" aria-label="下一研究">›</button></div></div><div class="panel-card"><div><b>${entry[1]} <span class="badge">${level}/${entry[4]}</span></b><small>${entry[2]}</small></div><button data-study="${index}" ${state.cores<price||level>=entry[4]?'disabled':''}>${level>=entry[4]?'已完成':'◈ '+price}</button></div><div class="panel-card"><div><b>协议 · ${{balanced:'均衡',pairs:'同点',straight:'顺子',recycle:'回收'}[state.mode]}</b><small>可随时切换</small></div><button data-mode="1">切换</button></div>`;}
 else {const progress=Factory.metric(state)-state.orderBase,target=Factory.orderTarget(state),reward=Factory.rebirthReward(state);$('panel').innerHTML=`<div class="panel-card"><div><b>订单 ${state.orders+1} · ${['回收','同点组','压缩','产出'][state.orders%4]}</b><small>${fmt(progress)} / ${fmt(target)}</small></div><button data-claim="1" ${progress<target?'disabled':''}>◈ ${1+Math.floor(state.orders/8)}</button></div><div class="panel-card"><div><b>换代重建</b><small>本代回收 ${fmt(state.collected)} · ◈ +${reward}</small></div><button data-rebirth="1" ${reward<3?'disabled':''}>重建</button></div><div class="panel-card"><div><b>引擎记录</b><small>${(state.seconds/3600).toFixed(1)} 小时 · 累计 ${fmt(state.lifetime)}</small></div><button data-help="1">说明</button></div>`;}}
 function render(){const burst=active();$('money').textContent=fmt(state.money);$('income').textContent='回收 '+Factory.carry(state).toFixed(1)+' / 秒';$('cores').textContent='◈ '+state.cores+' · 第 '+state.gen+' 代';$('era').textContent=state.gen>1?'第 '+state.gen+' 代工坊':state.coreTotal>=8?'共振工坊':'初代工坊';$('heat').textContent='热量 '+Math.floor(state.heat)+'%';$('pileFill').style.width=Math.min(100,state.pile/Factory.cap(state)*100)+'%';$('pileText').textContent='堆场 '+fmt(state.pile)+' / '+fmt(Factory.cap(state));$('couriers').textContent='回收机 ×'+(state.carry+1);$('scene').classList.toggle('evolved',state.coreTotal>=8);$('scene').classList.toggle('hot',state.heat>75);$('scene').classList.toggle('burst',burst);$('status').textContent=state.pile>Factory.cap(state)*.95?'堆场拥堵':burst?'共振 ×2':state.heat>75?'高热 · 减速':state.speed?'生产 → 搬运 → 入库':'点击投掷';$('roll').innerHTML=state.speed?'助推<small>下轮 −0.5 秒</small>':'投掷<small>碎晶落入堆场</small>';$('roll').disabled=paused||state.heat>=95||performance.now()<(state.speed?lastBoost+3000:lastManual+1100);$('burst').innerHTML=burst?'爆发中<small>'+Math.ceil((burstUntil-performance.now())/1000)+' 秒</small>':'共振<small>'+Math.floor(state.energy)+' / 100</small>';$('burst').disabled=paused||state.energy<100||burst||state.heat>35;$('compress').innerHTML='压缩<small>'+fmt(state.pile)+' / '+Factory.pressCost(state)+'</small>';$('compress').disabled=paused||state.pile<Factory.pressCost(state);$('footer').textContent=paused?'另一页面已接管，请关闭此页':blocked?'存储不可用 · 请导出':state.legacy?'旧版纪念已保留 · 新经济独立':'自动保存 · 离线回收上限 8 小时';const control=document.activeElement;const savedData=control&&$('panel').contains(control)?{...control.dataset}:null;renderPanel();if(savedData){const key=Object.keys(savedData)[0];if(key){const replacement=$('panel').querySelector('[data-'+key+'="'+savedData[key]+'"]');if(replacement)replacement.focus({preventScroll:true});}}}
 function animate(delta){if(!ctx)return;ctx.clearRect(0,0,width,height);links=links.filter(link=>(link.life+=delta)<.8);for(const link of links){ctx.globalAlpha=1-link.life/.8;ctx.strokeStyle='#acd7b3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(width*(.08+link.from[0]*.84),height*(.24+link.from[1]*.43));ctx.lineTo(width*(.08+link.to[0]*.84),height*(.24+link.to[1]*.43));ctx.stroke();}particles=particles.filter(particle=>(particle.life+=delta)<.9);for(const particle of particles){const fraction=particle.life/.9;ctx.globalAlpha=1-fraction*.4;ctx.fillStyle='#edd08b';ctx.fillRect(particle.left+(particle.target-particle.left)*fraction,particle.top+(height-42-particle.top)*fraction*fraction,3,3);}floats=floats.filter(entry=>(entry.life+=delta)<1.1);for(const entry of floats){ctx.globalAlpha=Math.min(1,(1.1-entry.life)*2);ctx.fillStyle='#c4f0d8';ctx.font='600 15px system-ui';ctx.textAlign='center';ctx.fillText(entry.text,width/2,height*.72-(light()?0:entry.life*12));}ctx.globalAlpha=1;}
 function burst(){if(state.energy<100||active()||state.heat>35)return;state.energy=0;burstUntil=performance.now()+6000;toast('共振启动 · 注意堆场');}
 function step(seconds){let remaining=seconds;while(remaining>0){const delta=Math.min(.2,remaining);remaining-=delta;Factory.tick(state,delta,active());if(state.speed){cycle+=delta;const period=Factory.period(state)*(state.heat>75?1.8:1)/(active()?1.5:1);if(cycle>=period){cycle%=period;perform();}}if(Factory.level(state,'auto')&&state.energy>=100&&state.heat<30)burst();}}
 function loop(now){const elapsed=Math.max(0,(now-clock)/1000);clock=now;if(!document.hidden&&!paused&&!migrationPending){if(elapsed>10){Factory.offline(state,Date.now());burstUntil=0;cycle=0;}else{step(elapsed);state.savedAt=Date.now();}animate(Math.min(.1,elapsed));if(now-lastPaint>180){render();lastPaint=now;}if(now-lastSave>5000){save();lastSave=now;}}requestAnimationFrame(loop);}
 function open(title,content){if($('overlay').hidden)focusBefore=document.activeElement;$('modalTitle').textContent=title;$('modalContent').innerHTML=content;$('overlay').hidden=false;$('close').focus();}
 function close(){if(migrationPending){migrationPending=false;save();}$('overlay').hidden=true;if(focusBefore&&focusBefore.isConnected)focusBefore.focus();}
 const helpPages=[['生产与回收','投骰只生成碎晶，搬运入库后才能购买升级。堆场满时多余产出损失。优先补齐瓶颈，而不是只买倍率。','同点配置：基础 −15%，同点奖励 ×1.7。均衡无修正。'],['共振与压缩','共振 6 秒：产出 ×2、自动速度 ×1.5、每秒升温 12。热量高于75会减速，95暂停投掷。结束后自动散热。','压缩把堆场碎晶换成1晶核，与搬运争夺同一份资源。升级堆场或扩充产出，才能持续压缩。'],['研究与换代','研究、晶核、总时长与累计产出跨代保留。重建清空本代库存、骰子、物流、订单和配置；启动套件提供新代资金。','顺子协议：三个以上连续不同点数获得奖励。回收协议：产出 −20%，搬运 +50%。切换即时生效。'],['离线与存档','离线按数学期望生产和搬运，最多8小时，不生成同点统计和能量，不自动压缩/领取订单。关闭页面结束共振。','50小时是长线开发目标。本版还没有跨生产线与终局工程，不以纯等待冒充完整50小时内容。']];
 function help(){const entry=helpPages[helpPage];open(entry[0],`<p>${entry[1]}</p><p>${entry[2]}</p><div class="row"><button data-help-page="-1">上一页</button><span class="tiny">${helpPage+1} / 4</span><button data-help-page="1">下一页</button></div><div class="controls"><button data-export="1">导出</button><button data-import="1">导入</button><button data-low="1">特效：${state.low?'轻量':'完整'}</button></div>`);}
 $('help').onclick=help;$('close').onclick=close;
 document.addEventListener('keydown',event=>{if($('overlay').hidden)return;if(event.key==='Escape'){close();return;}if(event.key==='Tab'){const focusable=[...$('overlay').querySelectorAll('button:not(:disabled)')];const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
 $('roll').onclick=()=>{if(paused)return;const now=performance.now();if(state.speed){if(now-lastBoost<3000)return;lastBoost=now;cycle+=.5;}else{if(now-lastManual<1100)return;lastManual=now;perform();}render();};$('burst').onclick=()=>{if(!paused){burst();render();}};$('compress').onclick=()=>{if(!paused&&Factory.compress(state)){toast('压缩完成 ◈ +1');render();save();}};
 document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;const data=button.dataset;if(data.tab){tab=data.tab;document.querySelectorAll('[data-tab]').forEach(entry=>entry.classList.toggle('active',entry.dataset.tab===tab));renderPanel();return;}if(data.help){help();return;}if(data.helpPage){helpPage=(helpPage+Number(data.helpPage)+4)%4;help();return;}if(data.export){const url=URL.createObjectURL(new Blob([JSON.stringify({...state,savedAt:Date.now()},null,2)],{type:'application/json'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='dice-factory-v2.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}if(data.import){$('file').click();return;}if(data.low){state.low=!state.low;document.body.classList.toggle('low',state.low);help();save();return;}if(paused)return;if(data.page){researchPage=(researchPage+Number(data.page)+12)%12;renderPanel();return;}if(data.buy&&Factory.buy(state,data.buy)){drawDice();toast('升级完成');}if(data.study!==undefined&&Factory.study(state,Number(data.study)))toast('研究完成');if(data.mode){const modes=['balanced','pairs'];if(Factory.level(state,'straight'))modes.push('straight');if(Factory.level(state,'recycle'))modes.push('recycle');state.mode=modes[(modes.indexOf(state.mode)+1)%modes.length];}if(data.claim&&Factory.claim(state))toast('订单完成');if(data.rebirth)open('确认换代',`<p>本代库存、骰子、物流和订单归零。保留全部研究与晶核。本次获得 ◈ ${Factory.rebirthReward(state)}。</p><div class="controls"><button data-confirm-rebirth="1">确认重建</button></div>`);if(data.confirmRebirth){const next=Factory.rebirth(state);if(next){state=next;cycle=0;burstUntil=0;token++;clearTimeout(visualTimer);particles=[];links=[];floats=[];values=[1];drawDice();close();toast('新一代开始');}}if(data.migrate){if(!migrationPending)return;let legacy;try{legacy=JSON.parse(oldRaw);if(legacy.version!==1||!Number.isFinite(legacy.total)||legacy.total<0)throw Error();localStorage.setItem('dice-engine-v1-backup',oldRaw);}catch{toast('旧档无法验证，未迁移');return;}state.legacy=true;const grant=Math.min(8,Math.floor(Math.log10(1+legacy.total)));state.cores+=grant;state.coreTotal+=grant;close();toast('旧档保留 · ◈ +'+grant);}if(data.fresh){close();}render();save();});
 $('file').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>50000)throw Error();const candidate=Factory.validate(JSON.parse(await file.text()));if(!confirm('覆盖当前新版进度？'))return;state=candidate;blocked=false;state.savedAt=Date.now();cycle=0;burstUntil=0;values=Array(state.count).fill(1);token++;drawDice();document.body.classList.toggle('low',state.low);close();save();render();toast('导入完成');}catch{toast('存档无效，未修改进度');}finally{event.target.value='';}};
 document.addEventListener('visibilitychange',()=>{if(document.hidden){burstUntil=0;cycle=0;token++;clearTimeout(visualTimer);save();}else if(!paused){const result=Factory.offline(state);clock=performance.now();render();save();if(result.amount>1)toast('离线回收 +'+fmt(result.amount));}});window.addEventListener('pagehide',save);window.addEventListener('storage',event=>{if(event.key!==storageKey||!event.newValue)return;try{const remote=JSON.parse(event.newValue);if(remote.session&&remote.session!==session){paused=true;render();toast('另一页面接管了存档');}}catch{}});
 document.body.classList.toggle('low',state.low);drawDice();resize();render();if(oldRaw&&!blocked){open('新版经济迁移','<p>旧余额不带入新版，避免数十亿点数跳过成长。保留旧存档，按旧累计产出兑换最多8晶核。</p><p>也可以不兑换，从零体验。旧版文件 backup-v1.html 可继续使用旧存档。</p><div class="controls"><button data-migrate="1">兑换纪念</button><button data-fresh="1">从零开始</button></div>');}else{save();if(offline.amount>1)toast('离线回收 +'+fmt(offline.amount));}requestAnimationFrame(loop);
})();
</script></body></html>
