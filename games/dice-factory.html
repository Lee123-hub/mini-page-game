<script>
'use strict';
const Factory=(()=>{

 ['magnet','磁力轨道','回收 +20% / 级',3,5],['cool','冷却鳍片','散热 +20% / 级',3,5],['echo','同点回响','同点奖励 +25% / 级',4,5],

 ];
 const fresh=(now=Date.now())=>({version:3,money:0,pile:0,count:1,value:0,speed:1,carry:0,store:0,cooler:0,heat:0,energy:0,cores:0,coreTotal:0,gen:1,produced:0,collected:0,lifetime:0,pairs:0,presses:0,rolls:0,orders:0,orderBase:0,research:{},mode:'balanced',mods:{},owned:[],equipped:[],drone:0,flight:0,droneCargo:0,droneFull:false,droneBoost:0,seconds:0,runSeconds:0,savedAt:now,low:false,legacy:false,stage:0,freeMods:0,policy:'build',trial:null,lastTrial:null,best:0,cycle:0,burstLeft:0,burstStart:0,lost:0});
 const level=(state,key)=>state.research[key]||0;
 const heritage=state=>1+.15*Math.min(10,state.gen-1);
 const protocols={balanced:{name:'均衡',short:'无增减 · 保留同点奖励',desc:'基础产出100%；每对同点奖励3，再计算研究与骰面倍率。'},pairs:{name:'同点',short:'基础 −15% · 同点 +70%',desc:'所有点数的基础收益×0.85，同点奖励×1.7。没有同点时会少赚。'},straight:{name:'顺子',short:'基础 −10% · 连续3点加成',desc:'基础收益×0.9；最长连续不同点数≥3时，每点额外+5。保留同点奖励。'},recycle:{name:'回收',short:'产出 −20% · 搬运 +50%',desc:'总产出×0.8，搬运速度×1.5。适合堆场拥堵时使用。'}};
 const modeUnlocked=(state,mode)=>Object.hasOwnProperty.call(protocols,mode)&&(!['straight','recycle'].includes(mode)||level(state,mode)>0);
 function setMode(state,mode){if(!modeUnlocked(state,mode))return false;state.mode=mode;return true;}
 const cap=state=>(120+state.store*100)*(1+.2*level(state,'storage'))*heritage(state);

 const period=state=>Math.max(1.1,(4.8-.22*Math.max(0,state.speed-1))*(1-.04*level(state,'clock')));
 const carry=state=>(1.1+.65*state.carry)*(1+.2*level(state,'magnet'))*(state.mode==='recycle'?1.5:1)*heritage(state);
 const devices={beacon:{name:'同点信标',cost:3,desc:'每轮同点：无人机提前1秒；每趟最多提前2秒。'},capacitor:{name:'满载电容',cost:4,desc:'无人机满载到库：共振+8；爆发期间不充能。'}};

 const dieFaces=(state,index)=>Array.from({length:6},(_,face)=>{const kind=state.mods[index+':'+face]||'plain';return {value:kind==='six'?6:face+1,kind};});
 const modCost=(state,die)=>state.freeMods>0?0:25+Object.keys(state.mods).filter(key=>key.startsWith(die+':')).length*20;
 function modify(state,die,face,kind){if(state.stage<2)return false;if(!Number.isInteger(die)||die<0||die>=state.count||!Number.isInteger(face)||face<0||face>5||!['plain','six','magnet'].includes(kind))return false;const key=die+':'+face,old=state.mods[key]||'plain';if(old===kind||kind==='six'&&face===5)return false;if(kind==='plain'){delete state.mods[key];return true;}const used=Object.keys(state.mods).filter(entry=>entry.startsWith(die+':')).length;if(old==='plain'&&used>=2)return false;const price=modCost(state,die);if(state.money<price)return false;state.money-=price;if(state.freeMods>0)state.freeMods--;state.mods[key]=kind;return true;}
 function device(state,key){if(state.stage<3)return false;const entry=Object.hasOwnProperty.call(devices,key)?devices[key]:null;if(!entry)return false;if(!state.owned.includes(key)){if(state.cores<entry.cost)return false;state.cores-=entry.cost;state.owned.push(key);if(state.equipped.length<socketLimit(state))state.equipped.push(key);return true;}const index=state.equipped.indexOf(key);if(index>=0){state.equipped.splice(index,1);return true;}if(state.equipped.length>=socketLimit(state))return false;state.equipped.push(key);return true;}
 const cooling=state=>(3+.45*state.cooler)*(1+.2*level(state,'cool'));
 const pressCost=state=>Math.round((120+80*(state.gen-1))*(1-.06*level(state,'press')));
 const cost=(state,key)=>{const bases={count:40,value:30,speed:100,carry:25,store:65,cooler:85,drone:90},growth={count:2.8,value:1.36,speed:1.75,carry:1.38,store:1.52,cooler:1.5,drone:1.65},limits={count:6,value:30,speed:12,carry:30,store:20,cooler:20,drone:10};if(key==='drone'&&state.stage<1||!Object.hasOwnProperty.call(bases,key)||state[key]>=limits[key])return Infinity;return Math.ceil(bases[key]*growth[key]**(state[key]-(key==='count'?1:0)));};
 function buy(state,key){const price=cost(state,key);if(!Number.isFinite(price)||state.money<price)return false;state.money-=price;state[key]++;return true;}
 function outcome(state,values,magnetic=[]){const counts=Array(6).fill(0);values.forEach(value=>counts[value-1]++);const pairs=counts.reduce((sum,count)=>sum+Math.floor(count/2),0);const unique=new Set(values).size;let bonus=pairs*3*(1+.25*level(state,'echo'))*(state.mode==='pairs'?1.7:1);if(state.mode==='straight'&&unique>=3){const sorted=[...new Set(values)].sort((left,right)=>left-right);let chain=1,best=1;for(let index=1;index<sorted.length;index++){chain=sorted[index]===sorted[index-1]+1?chain+1:1;best=Math.max(best,chain);}if(best>=3)bonus+=best*5;}const base=values.reduce((sum,value,index)=>sum+value*(magnetic[index]?.5:1),0)*(state.mode==='pairs'?.85:state.mode==='straight'?.9:1);return {amount:(base+bonus)*factor(state)*(state.mode==='recycle'?.8:1),pairs,counts};}
 function deposit(state,amount){const accepted=Math.max(0,Math.min(amount,cap(state)-state.pile));state.lost+=Math.max(0,amount-accepted);state.pile+=accepted;state.produced+=accepted;state.lifetime+=accepted;return accepted;}

 function roll(state,random=Math.random,burst=false){const selected=Array.from({length:state.count},(_,index)=>dieFaces(state,index)[Math.floor(random()*6)]),values=selected.map(face=>face.value),magnetic=selected.map(face=>face.kind==='magnet');const result=outcome(state,values,magnetic);result.amount=deposit(state,result.amount*(burst?2:1));result.magnetIncome=collect(state,magnetic.filter(Boolean).length*carry(state)*2);result.signal=false;if(result.pairs&&state.drone&&state.equipped.includes('beacon')){const advance=Math.min(1,2-state.droneBoost);state.droneBoost+=advance;result.signal=advance>0;}state.rolls++;state.pairs+=result.pairs;if(!burst)state.energy=Math.min(100,state.energy+(3+result.pairs*6)*(1+.15*level(state,'charge')+.5*level(state,'auto')));return {...result,values,magnetic};}

 const compressionYield=state=>state.gen>=5?2:1;

 function rebirth(state){const reward=rebirthReward(state);if(!reward)return null;const next=fresh();Object.assign(next,{cores:state.cores+reward,coreTotal:state.coreTotal+reward,gen:state.gen+1,stage:state.stage,research:{...state.research},owned:[...state.owned],equipped:[...state.equipped],mods:{...state.mods},freeMods:state.freeMods,policy:state.policy,seconds:state.seconds,lifetime:state.lifetime,low:state.low});next.money=120+level(next,'seed')*60;next.count=Math.max(next.gen>=5?4:next.gen>=3?3:2,...Object.keys(next.mods).map(key=>Number(key[0])+1));next.carry=2;next.store=1;next.drone=1;if(next.gen===2){if(!next.owned.includes('capacitor'))next.owned.push('capacitor');if(next.equipped.length<2&&!next.equipped.includes('capacitor'))next.equipped.push('capacitor');}if(next.gen===3)next.research.straight=1;if(next.gen===4)next.research.recycle=1;return next;}
 function validate(input,now=Date.now()){if(!input||input.version!==3)throw Error('版本无效');const result=fresh(now);const limits={money:1e15,pile:1e7,count:6,value:30,speed:12,carry:30,store:20,cooler:20,heat:100,energy:100,cores:1e8,coreTotal:1e9,gen:1e6,produced:1e15,collected:1e15,lifetime:1e15,pairs:1e12,presses:1e7,rolls:1e12,orders:1e7,orderBase:1e15,seconds:1e12,runSeconds:1e12,savedAt:now+300000};const ints=['count','value','speed','carry','store','cooler','cores','coreTotal','gen','pairs','presses','rolls','orders'];for(const [key,max]of Object.entries(limits)){const value=input[key];if(typeof value!=='number'||!Number.isFinite(value)||value<0||value>max||ints.includes(key)&&!Number.isInteger(value))throw Error('字段无效');result[key]=value;}if(result.count<1||result.gen<1||!input.research||typeof input.research!=='object')throw Error('存档无效');for(const entry of research){const value=input.research[entry[0]]===undefined?0:input.research[entry[0]];if(!Number.isInteger(value)||value<0||value>entry[4])throw Error('研究无效');if(value)result.research[entry[0]]=value;}if(!['balanced','pairs','straight','recycle'].includes(input.mode))throw Error('配置无效');if(input.mode==='straight'&&!level(result,'straight')||input.mode==='recycle'&&!level(result,'recycle'))throw Error('配置未解锁');result.mode=input.mode;
 for(const [key,max]of [['drone',10],['flight',20],['droneCargo',1e6],['droneBoost',2]]){const value=input[key]===undefined?0:input[key];if(typeof value!=='number'||!Number.isFinite(value)||value<0||value>max||key==='drone'&&!Number.isInteger(value))throw Error('物流字段无效');result[key]=value;}
 result.droneFull=input.droneFull===true;if(result.droneCargo>droneCapacity(result)||!result.drone&&(result.droneCargo||result.flight||result.droneFull||result.droneBoost))throw Error('货舱无效');

   const current=[...parent.childNodes],incoming=[...desired.childNodes];
   incoming.forEach((next,index)=>{

 for(let index=0;index<3;index++){const robot=$('robot'+index);robot.style.display=index<robotCount?'flex':'none';const phase=light()?.5:(state.seconds*(active()?.65:.35)+index/3)%1;robot.style.left=(phase<.5?phase*2:(1-phase)*2)*82+'%';robot.classList.toggle('loaded',phase<.5&&state.pile>0);}
 const drone=$('drone');drone.style.display=state.drone?'flex':'none';const flight=Math.min(1,state.flight/(Factory.dronePeriod(state)-state.droneBoost));drone.style.left=(light()?.5:flight)*85+'%';drone.classList.toggle('loaded',state.droneCargo>0);drone.textContent=state.droneCargo>0?'◆':'◇';$('fleetCount').textContent='机器人 ×'+(state.carry+1)+(state.drone?' · 货舱 '+fmt(state.droneCargo):'');
 if(!ctx)return;ctx.clearRect(0,0,width,height);links=links.filter(link=>(link.life+=delta)<.8);for(const link of links){ctx.globalAlpha=1-link.life/.8;ctx.strokeStyle='#acd7b3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(width*(.08+link.from[0]*.84),height*(.24+link.from[1]*.43));ctx.lineTo(width*(.08+link.to[0]*.84),height*(.24+link.to[1]*.43));ctx.stroke();}particles=particles.filter(particle=>(particle.life+=delta)<.9);for(const particle of particles){const fraction=particle.life/.9;ctx.globalAlpha=1-fraction*.4;ctx.fillStyle='#edd08b';ctx.fillRect(particle.left+(particle.target-particle.left)*fraction,particle.top+(height-42-particle.top)*fraction*fraction,3,3);}floats=floats.filter(entry=>(entry.life+=delta)<1.1);for(const entry of floats){ctx.globalAlpha=Math.min(1,(1.1-entry.life)*2);ctx.fillStyle='#c4f0d8';ctx.font='600 15px system-ui';ctx.textAlign='center';ctx.fillText(entry.text,width/2,height*.72-(light()?0:entry.life*12));}ctx.globalAlpha=1;}
 function step(seconds){const events=Factory.advance(state,seconds);for(const event of events){if(event.type==='roll')visuals(event.result);if(event.type==='burst')toast('自动共振 · 物流同步加速');if(event.type==='burstEnd')toast('共振入库 +'+fmt(event.amount));if(event.type==='breakthrough'){drawDice();toast('突破成功 · '+Factory.chapters[state.gen-1].rewards[(event.stage-1)%3]);const scene=$('scene');scene.classList.remove('breakthrough');void scene.offsetWidth;scene.classList.add('breakthrough');setTimeout(()=>scene.classList.remove('breakthrough'),1500);}}}

 function loop(now){const elapsed=Math.max(0,(now-clock)/1000);clock=now;if(!document.hidden&&!paused&&!migrationPending){if(elapsed>10){Factory.offline(state,Date.now());burstUntil=0;cycle=0;}else{step(elapsed);state.savedAt=Date.now();}if(burstUntil&&now>=burstUntil){toast('共振入库 +'+fmt(Math.max(0,state.collected-burstCollected)));burstUntil=0;}animate(Math.min(.1,elapsed));if(now-lastPaint>180){render();lastPaint=now;}if(now-lastSave>5000){save();lastSave=now;}}requestAnimationFrame(loop);}
 function open(title,content){if($('overlay').hidden)focusBefore=document.activeElement;$('modalTitle').textContent=title;$('modalContent').innerHTML=content;$('overlay').hidden=false;$('close').focus();}
 function close(){editOpen=false;if(migrationPending){migrationPending=false;save();}$('overlay').hidden=true;if(focusBefore&&focusBefore.isConnected)focusBefore.focus();}
 const helpPages=[['主线与突破','每章三次自动试炼。只测本轮新产出的入库量；旧库存、钱包和在途货物不算。试炼使用独立的配置快照，不额外发放模拟收益。真实工坊照常生产。','试炼期间升级下轮生效。每轮第10秒开启6秒标准脉冲，不依赖手速。失败不扣钱，自动再试；详情可查看最佳成绩与瓶颈。'],['生产与联动','先投骰产出，再搬运入库。溢出会永久损失碎晶。升级要同时考虑生产与物流。均衡仍有基础同点奖励；协议只在生产页配置。','首次突破赠无人机，第二次解锁改造并送一次免费机会，第三次解锁信标、研究、设备及自动化。信标让同点加快货运，电容让满载回充共振。'],['压缩与换代','压缩固定消耗已入库碎晶，不再抢堆场货物。建设优先保留下一项建设预算；研究优先将可兑换余额转晶核；暂停则不兑换。','完成本章三次突破才能换代。保留晶核、改造、研究、设备，重建机器并领启动包。第二章双设备槽与电容，第三章顺子，第四章回收，第五章双晶压缩。'],['存档与离线','本版从全新开局开始，不读取旧版进度。离线最多8小时，按基础期望生产及物流回收，遵循自动压缩策略。离线不推进试炼，不模拟共振或设备连锁。','六章数值仍需试玩校准，不保证已有50小时内容。导入只接受本版存档；刷新或返回页面会重新开始当前试炼，不损失已完成突破。']];
 function protocolDialog(){open('协议配置',Object.entries(Factory.protocols).map(([mode,entry])=>{const unlocked=Factory.modeUnlocked(state,mode),selected=state.mode===mode;return `<div class="protocol-choice ${selected?'active':''}"><div><b>${entry.name}${selected?' · 已激活':''}</b><p>${entry.short}</p></div><button data-select-mode="${mode}" aria-pressed="${selected}" ${!unlocked||selected?'disabled':''}>${selected?'已激活':unlocked?'激活':'需研究'}</button></div>`;}).join('')+`<p>当前：${Factory.protocols[state.mode].desc}</p>`);}
 function rebirthDialog(){const reward=Factory.rebirthReward(state),target=Factory.goal(state);open('架构升级',`<div class="reward-list"><div>奖励 <strong>◈ +${reward||8+state.gen*4}</strong></div><div>永久产出 / 物流 / 堆场 <strong>+15%</strong></div><div>新能力 <strong>${Factory.milestone(Math.min(6,state.gen+1))}</strong></div></div><p>保留晶核、研究、设备、骰面改造。重建生产与物流等级，自动提供启动资金、骰子、无人机、搬运2级及堆场1级。库存与在途货物清空。</p><p>${target.done?'本章全部突破，准备进入下一章。':'完成本章三次突破后解锁。不用刷回收总额。'}</p><div class="controls"><button data-confirm-rebirth="1" ${!reward?'disabled':''}>确认升级</button></div>`);}
 function editor(){tab='modify';renderPanel();revealTab();}
 function revealTab(){const button=document.querySelector('[data-tab="'+tab+'"]');if(button&&button.scrollIntoView)button.scrollIntoView({block:'nearest',inline:'nearest',behavior:'auto'});}
 function help(){const entry=helpPages[helpPage];open(entry[0],`<p>${entry[1]}</p><p>${entry[2]}</p><div class="row"><button data-help-page="-1">上一页</button><span class="tiny">${helpPage+1} / 4</span><button data-help-page="1">下一页</button></div><div class="controls"><button data-export="1">导出</button><button data-import="1">导入</button><button data-low="1">特效：${state.low?'轻量':'完整'}</button></div>`);}
 $('help').onclick=help;$('goal').onclick=goalDialog;$('goal').onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();goalDialog();}};$('close').onclick=close;
 document.addEventListener('keydown',event=>{if($('overlay').hidden)return;if(event.key==='Escape'){close();return;}if(event.key==='Tab'){const focusable=[...$('overlay').querySelectorAll('button:not(:disabled)')];const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
 $('roll').onclick=goalDialog;$('burst').onclick=()=>open('自动共振','<p>连锁突破后自动启动。能量满且热量低于30：爆发6秒，产出×2、投掷与无人机×1.5、搬运×2。</p><p>爆发期间不充能。无需手点，也不消耗晶核。</p>');$('compress').onclick=policyDialog;
 document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;const data=button.dataset;if(data.tab){tab=data.tab;document.querySelectorAll('[data-tab]').forEach(entry=>entry.classList.toggle('active',entry.dataset.tab===tab));renderPanel();revealTab();return;}if(data.policy){state.policy=data.policy;policyDialog();save();render();return;}if(data.help){help();return;}if(data.helpPage){helpPage=(helpPage+Number(data.helpPage)+4)%4;help();return;}if(data.export){const url=URL.createObjectURL(new Blob([JSON.stringify({...state,trial:null,savedAt:Date.now()},null,2)],{type:'application/json'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='dice-factory-v3.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}if(data.import){$('file').click();return;}if(data.low){state.low=!state.low;document.body.classList.toggle('low',state.low);help();save();return;}if(paused)return;if(data.editDie!==undefined){if(state.stage<2){toast('第二次突破解锁改造');return;}const index=Number(data.editDie);if(!Number.isInteger(index)||index<0||index>=state.count)return;selectedDie=index;selectedFace=0;editor();return;}if(data.faceIndex!==undefined){const index=Number(data.faceIndex);if(!Number.isInteger(index)||index<0||index>5)return;selectedFace=index;editor();return;}if(data.mod){if(Factory.modify(state,selectedDie,selectedFace,data.mod)){values=Array(state.count).fill(1);drawDice();editor();save();toast('改造完成');}else{editor();toast('资金不足或改造位已满');}return;}if(data.device){if(Factory.device(state,data.device)){save();renderPanel();}else toast('设备槽已满，请先卸下');return;}if(data.page){researchPage=(researchPage+Number(data.page)+12)%12;renderPanel();return;}if(data.buy&&Factory.buy(state,data.buy)){drawDice();toast('升级完成');}if(data.study!==undefined&&Factory.study(state,Number(data.study)))toast('研究完成');if(data.protocol){protocolDialog();return;}if(data.selectMode&&Factory.setMode(state,data.selectMode)){protocolDialog();toast(Factory.protocols[state.mode].name+'协议已激活');}if(data.claim&&Factory.claim(state))toast('订单完成');if(data.rebirth){rebirthDialog();return;}if(data.confirmRebirth){const next=Factory.rebirth(state);if(next){state=next;cycle=0;burstUntil=0;token++;clearTimeout(visualTimer);particles=[];links=[];floats=[];values=[1];drawDice();close();toast('新一代开始');}}render();save();});
 $('file').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>50000)throw Error();const candidate=Factory.validate(JSON.parse(await file.text()));if(!confirm('覆盖当前新版进度？'))return;state=candidate;blocked=false;state.savedAt=Date.now();cycle=0;burstUntil=0;values=Array(state.count).fill(1);token++;drawDice();document.body.classList.toggle('low',state.low);close();save();render();toast('导入完成');}catch{toast('存档无效，未修改进度');}finally{event.target.value='';}};
 document.addEventListener('visibilitychange',()=>{if(document.hidden){state.burstLeft=0;state.trial=null;burstUntil=0;cycle=0;token++;clearTimeout(visualTimer);save();}else if(!paused){const result=Factory.offline(state);clock=performance.now();drawDice();render();save();if(result.amount>1)toast('离线回收 +'+fmt(result.amount));}});window.addEventListener('pagehide',save);window.addEventListener('storage',event=>{if(event.key!==storageKey||!event.newValue)return;try{const remote=JSON.parse(event.newValue);if(remote.session&&remote.session!==session){paused=true;render();toast('另一页面接管了存档');}}catch{}});
 function goalDialog(){const target=Factory.goal(state),last=state.lastTrial;open('突破 · '+target.chapter,`<p>${target.done?'本章已完成，请前往换代。':target.duration+'秒内，将新产出的 '+fmt(target.target)+' 碎晶送入仓库。'}</p><div class="reward-list"><div>最佳 <strong>${fmt(state.best)} / ${fmt(target.target)}</strong></div><div>瓶颈 <strong>${Factory.diagnosis(state)}</strong></div><div>奖励 <strong>${target.reward}</strong></div>${last?'<div>上轮 '+fmt(last.score)+' / '+fmt(last.target)+(last.passed?' · 已突破':' · 继续优化')+'</div>':''}</div><p>自动重试，无失败费用。采用本轮开始时的机器配置，升级下轮生效。旧库存不计分；模拟成绩不额外发钱。第10秒固定脉冲，排除手速影响。</p><p>${Factory.diagnosis(state)==='物流不足'?'试试物流升级、磁力面或回收协议。':'试试增加骰子、骰面增幅或投掷加速。'}</p>`);}
 function policyDialog(){open('自动压缩',`<p>${state.stage<3?'第三次突破后开启。':''}固定兑换：◇ ${Factory.pressCost(state)} → ◈ ${Factory.compressionYield(state)}。消耗已入库碎晶，不动试炼货物。</p>`+Object.entries({build:'建设优先',research:'研究优先',pause:'暂停压缩'}).map(([key,name])=>`<div class="protocol-choice ${state.policy===key?'active':''}"><div><b>${name}</b><p>${key==='build'?'保留可购买建设项中最高一项的预算':key==='research'?'可兑换余额全部用于晶核':'保留碎晶，不自动兑换'}</p></div><button data-policy="${key}" ${state.policy===key?'disabled':''}>${state.policy===key?'已激活':'启用'}</button></div>`).join(''));}
 document.body.classList.toggle('low',state.low);drawDice();resize();render();save();if(offline.amount>1)toast('离线回收 +'+fmt(offline.amount));requestAnimationFrame(loop);
})();
</script></body></html>
