  if(paged){const keys=tab==='production'?['count','value','speed']:['carry','drone','store','cooler'],page=tab==='production'?productionPage:logisticsPage,total=Math.ceil(keys.length/2);updateMarkup($('panel'),`<div class="panel-page-heading"><span>${tab==='production'?'生产升级':'物流升级'}</span><div class="pager"><button data-upgrade-page="-1" aria-label="上一组">‹</button>${page+1}/${total}<button data-upgrade-page="1" aria-label="下一组">›</button></div></div><div class="upgrade-grid">${keys.slice(page*2,page*2+2).map(key=>{const entry=info[key],price=Factory.cost(state,key);return `<button class="upgrade" data-buy="${key}" ${paused||state.money<price?'disabled':''}><span><strong>${typeof entry[1]==='function'?entry[1]():entry[1]}</strong><small>${Number.isFinite(price)?entry[2]():'已满级'}</small></span><span class="price">${Number.isFinite(price)?fmt(price):'MAX'}</span></button>`;}).join('')}${tab==='production'&&page===1?'<button class="upgrade" data-protocol="1"><span><strong>协议配置</strong><small>选择生产方向</small></span><span class="price">→</span></button>':''}</div>`);}
  else if(tab==='devices'){updateMarkup($('panel'),Object.entries(Factory.devices).map(([key,entry])=>`<div class="panel-card"><div><b>${entry.name} ${state.equipped.includes(key)?'● 已装':''}</b><small>${entry.desc}</small></div><button data-device="${key}" ${!state.owned.includes(key)&&state.cores<entry.cost?'disabled':''}>${state.equipped.includes(key)?'卸下':state.owned.includes(key)?'装上':'◈ '+entry.cost}</button></div>`).join(''));}
  else if(tab==='research'){const index=researchPage,entry=Factory.research[index],level=Factory.level(state,entry[0]),price=Factory.researchCost(state,index);updateMarkup($('panel'),`<div class="panel-card"><b>研究室</b><div class="pager"><button data-page="-1" aria-label="上一研究">‹</button>${index+1}/12<button data-page="1" aria-label="下一研究">›</button></div></div><div class="panel-card"><div><b>${entry[1]} <span class="badge">${level}/${entry[4]}</span></b><small>${entry[2]}</small></div><button data-study="${index}" ${state.cores<price||level>=entry[4]?'disabled':''}>${level>=entry[4]?'已完成':'◈ '+price}</button></div>`);}
  else{const progress=Factory.metric(state)-state.orderBase,target=Factory.orderTarget(state);updateMarkup($('panel'),`<div class="panel-card"><div><b>订单 ${state.orders+1} · ${['回收','同点组','压缩','产出'][state.orders%4]}</b><small>${fmt(progress)} / ${fmt(target)}</small></div><button data-claim="1" ${progress<target?'disabled':''}>◈ ${1+Math.floor(state.orders/8)}</button></div><div class="panel-card"><div><b>第 ${state.gen} 代</b><small>换代回收 ${fmt(state.collected)} / ${fmt(Factory.rebirthGoal(state))}</small></div><button data-rebirth="1">奖励预览</button></div>`);}
 }
 function renderEditor(){selectedDie=Math.max(0,Math.min(state.count-1,selectedDie));const faces=Factory.dieFaces(state,selectedDie),face=faces[selectedFace],used=Object.keys(state.mods).filter(key=>key.startsWith(selectedDie+':')).length,price=Factory.modCost(state,selectedDie),can=!paused&&state.money>=price&&(used<2||face.kind!=='plain');updateMarkup($('inlineEditor'),`<div class="editor-heading"><strong>骰面改造 <small>${used}/2</small></strong><div class="die-selectors" role="group" aria-label="选择骰子">${Array.from({length:state.count},(_,index)=>`<button data-edit-die="${index}" aria-pressed="${index===selectedDie}" aria-label="骰子${index+1}">${index+1}</button>`).join('')}</div></div><div class="edit-faces" role="group" aria-label="选择骰面">${faces.map((entry,index)=>`<button data-face-index="${index}" class="${index===selectedFace?'selected':''}" aria-pressed="${index===selectedFace}" aria-label="第${index+1}面，${entry.value}点，${entry.kind==='magnet'?'磁力':entry.kind==='six'?'改六':'普通'}"><small>面${index+1}</small><strong>${entry.value}</strong><small>${entry.kind==='magnet'?'磁力':entry.kind==='six'?'改六':'普通'}</small></button>`).join('')}</div><div class="edit-actions"><button data-mod="six" ${!can||face.kind==='six'||selectedFace===5?'disabled':''}>改成六<small>◇ ${price}</small></button><button data-mod="magnet" ${!can||face.kind==='magnet'?'disabled':''} title="该面基础减半，掷中立即搬运2秒产能">磁力面<small>◇ ${price}</small></button><button data-mod="plain" ${paused||face.kind==='plain'?'disabled':''}>还原<small>免费 · 不退款</small></button></div>`);}

 function render(){const burst=active();$('money').textContent=fmt(state.money);$('cores').textContent=fmt(state.cores);$('era').textContent='第 '+state.gen+' 代 · '+Factory.protocols[state.mode].name+' 已激活';$('heat').textContent='热量 '+Math.floor(state.heat)+'%';$('pileFill').style.width=Math.min(100,state.pile/Factory.cap(state)*100)+'%';$('pileText').textContent='堆场 '+fmt(state.pile)+' / '+fmt(Factory.cap(state));$('couriers').textContent='搬运 '+Factory.carry(state).toFixed(1)+'/秒'+(state.drone?' + 无人机':'');$('scene').classList.toggle('evolved',state.coreTotal>=8);$('scene').classList.toggle('hot',state.heat>75);$('scene').classList.toggle('burst',burst);$('status').textContent=state.pile>Factory.cap(state)*.95?'堆场拥堵':burst?'共振 ×2':state.heat>75?'高热 · 减速':state.speed?'生产 → 搬运 → 入库':'点骰子可改造';updateMarkup($('roll'),state.speed?'助推<small>下轮 −0.5 秒</small>':'投掷<small>碎晶落入堆场</small>');$('roll').disabled=paused||state.heat>=95||performance.now()<(state.speed?lastBoost+3000:lastManual+1100);updateMarkup($('burst'),burst?'爆发中<small>'+Math.ceil((burstUntil-performance.now())/1000)+' 秒</small>':'共振<small>'+Math.floor(state.energy)+' / 100</small>');$('burst').disabled=paused||state.energy<100||burst||state.heat>35;updateMarkup($('compress'),'压缩<small>'+fmt(state.pile)+' / '+Factory.pressCost(state)+'</small>');$('compress').disabled=paused||state.pile<Factory.pressCost(state);$('footer').textContent=paused?'另一页面已接管，请关闭此页':blocked?'存储不可用 · 请导出':state.legacy?'旧版纪念已保留 · 新经济独立':'自动保存 · 离线回收上限 8 小时';renderPanel();renderEditor();$('protocolShortcut').textContent='● '+Factory.protocols[state.mode].name+'协议 · 配置';$('rebirthShortcut').textContent='换代预览'+(Factory.rebirthReward(state)?' · ◈ +'+Factory.rebirthReward(state):'');}
 function animate(delta){
 const robotCount=Math.min(3,1+Math.floor(state.carry/3));
 for(let index=0;index<3;index++){const robot=$('robot'+index);robot.style.display=index<robotCount?'flex':'none';const phase=light()?.5:(state.seconds*(active()?.65:.35)+index/3)%1;robot.style.left=(phase<.5?phase*2:(1-phase)*2)*82+'%';robot.classList.toggle('loaded',phase<.5&&state.pile>0);}
 const drone=$('drone');drone.style.display=state.drone?'flex':'none';const flight=Math.min(1,state.flight/(Factory.dronePeriod(state)-state.droneBoost));drone.style.left=(light()?.5:flight)*85+'%';drone.classList.toggle('loaded',state.droneCargo>0);drone.textContent=state.droneCargo>0?'◆':'◇';$('fleetCount').textContent='机器人 ×'+(state.carry+1)+(state.drone?' · 货舱 '+fmt(state.droneCargo):'');
 if(!ctx)return;ctx.clearRect(0,0,width,height);links=links.filter(link=>(link.life+=delta)<.8);for(const link of links){ctx.globalAlpha=1-link.life/.8;ctx.strokeStyle='#acd7b3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(width*(.08+link.from[0]*.84),height*(.24+link.from[1]*.43));ctx.lineTo(width*(.08+link.to[0]*.84),height*(.24+link.to[1]*.43));ctx.stroke();}particles=particles.filter(particle=>(particle.life+=delta)<.9);for(const particle of particles){const fraction=particle.life/.9;ctx.globalAlpha=1-fraction*.4;ctx.fillStyle='#edd08b';ctx.fillRect(particle.left+(particle.target-particle.left)*fraction,particle.top+(height-42-particle.top)*fraction*fraction,3,3);}floats=floats.filter(entry=>(entry.life+=delta)<1.1);for(const entry of floats){ctx.globalAlpha=Math.min(1,(1.1-entry.life)*2);ctx.fillStyle='#c4f0d8';ctx.font='600 15px system-ui';ctx.textAlign='center';ctx.fillText(entry.text,width/2,height*.72-(light()?0:entry.life*12));}ctx.globalAlpha=1;}
 function burst(){if(state.energy<100||active()||state.heat>35)return;state.energy=0;burstCollected=state.collected;burstUntil=performance.now()+6000;toast('共振启动 · 物流同步超载');}
 function step(seconds){let remaining=seconds;while(remaining>0){const delta=Math.min(.2,remaining);remaining-=delta;Factory.tick(state,delta,active());if(state.speed){cycle+=delta;const period=Factory.period(state)*(state.heat>75?1.8:1)/(active()?1.5:1);if(cycle>=period){cycle%=period;perform();}}if(state.gen>=3&&state.pile>=Factory.cap(state)*.9&&state.pile>=Factory.pressCost(state))Factory.compress(state);if(Factory.level(state,'auto')&&state.energy>=100&&state.heat<30)burst();}}
 function loop(now){const elapsed=Math.max(0,(now-clock)/1000);clock=now;if(!document.hidden&&!paused&&!migrationPending){if(elapsed>10){Factory.offline(state,Date.now());burstUntil=0;cycle=0;}else{step(elapsed);state.savedAt=Date.now();}if(burstUntil&&now>=burstUntil){toast('共振入库 +'+fmt(Math.max(0,state.collected-burstCollected)));burstUntil=0;}animate(Math.min(.1,elapsed));if(now-lastPaint>180){render();lastPaint=now;}if(now-lastSave>5000){save();lastSave=now;}}requestAnimationFrame(loop);}
 function open(title,content){if($('overlay').hidden)focusBefore=document.activeElement;$('modalTitle').textContent=title;$('modalContent').innerHTML=content;$('overlay').hidden=false;$('close').focus();}
 function close(){editOpen=false;if(migrationPending){migrationPending=false;save();}$('overlay').hidden=true;if(focusBefore&&focusBefore.isConnected)focusBefore.focus();}
 const helpPages=[['生产与回收','投骰只生成碎晶，搬运入库后才能购买升级。堆场满时多余产出损失。优先补齐瓶颈，而不是只买倍率。','主屏改造：先选骰子编号，再选六面之一。每骰最多两面。改六增加组合机会；磁力面半价产出换即时搬运。同点信标每趟最多提前2秒，满载电容爆发期间不充能。'],['共振与压缩','共振6秒：产出×2、投掷与无人机速度×1.5、机器人搬运×2、每秒升温12。结束显示期间真实入库总额，不代表净额外收益。热量高于75会减速，95暂停投掷。结束后自动散热。','压缩把堆场碎晶换成晶核，与搬运争夺资源。第五代前每次1晶核，之后2晶核；第三代起堆场达90%自动压缩，费用与手动相同。'],['研究与换代','设备购买永久保留，换代清空骰面改造与无人机等级。第一代一槽、第二代两槽。换代保留研究与晶核，清空本代升级和库存。至少奖励12晶核，每代永久产出/回收/容量+15%（加算，上限+150%）。新代自动开局，第三代自动压缩，第五代每次压缩2晶核。','顺子基础−10%，连续不同点数≥3额外奖励。均衡也保留基础同点奖励。换代门槛3500起，每代×1.9，额外投入至门槛4倍最多再奖8晶核。'],['离线与存档','离线按改造后的骰面期望生产，机器人与无人机按基础产能回收，最多8小时。结清在途货物，不重复入账。离线不触发磁力额外搬运、设备充能和自动压缩。关闭页面结束共振。','50小时是长线开发目标。本版还没有跨生产线与终局工程，不以纯等待冒充完整50小时内容。']];
 function protocolDialog(){open('协议配置',Object.entries(Factory.protocols).map(([mode,entry])=>{const unlocked=Factory.modeUnlocked(state,mode),selected=state.mode===mode;return `<div class="protocol-choice ${selected?'active':''}"><div><b>${entry.name}${selected?' · 已激活':''}</b><p>${entry.short}</p></div><button data-select-mode="${mode}" aria-pressed="${selected}" ${!unlocked||selected?'disabled':''}>${selected?'已激活':unlocked?'激活':'需研究'}</button></div>`;}).join('')+`<p>当前：${Factory.protocols[state.mode].desc}</p>`);}
 function rebirthDialog(){const reward=Factory.rebirthReward(state),nextGen=state.gen+1;open('第 '+nextGen+' 代重建',`<div class="reward-list"><div>换代奖励 <strong>◈ +${reward||12+Math.min(20,2*(state.gen-1))}</strong> 晶核</div><div>永久产出 / 回收 / 容量 <strong>+${Math.round((Factory.heritage({...state,gen:nextGen})-1)*100)}%</strong></div><div>本代新能力 <strong>${Factory.milestone(nextGen)}</strong></div><div>开局 <strong>${nextGen>=4?3:2}骰 · 自动机 · 120碎晶</strong></div></div><p>保留研究、已购设备与晶核。骰面改造、无人机等级、货舱和本代生产/物流升级归零。启动套件额外资金保留。</p><p class="warning">${reward?'确认后立即重建':'本代回收 '+fmt(state.collected)+' / '+fmt(Factory.rebirthGoal(state))}</p><div class="controls"><button data-confirm-rebirth="1" ${!reward?'disabled':''}>确认重建</button></div>`);}
 function editor(){renderEditor();}
 function help(){const entry=helpPages[helpPage];open(entry[0],`<p>${entry[1]}</p><p>${entry[2]}</p><div class="row"><button data-help-page="-1">上一页</button><span class="tiny">${helpPage+1} / 4</span><button data-help-page="1">下一页</button></div><div class="controls"><button data-export="1">导出</button><button data-import="1">导入</button><button data-low="1">特效：${state.low?'轻量':'完整'}</button></div>`);}
 $('help').onclick=help;$('close').onclick=close;
 document.addEventListener('keydown',event=>{if($('overlay').hidden)return;if(event.key==='Escape'){close();return;}if(event.key==='Tab'){const focusable=[...$('overlay').querySelectorAll('button:not(:disabled)')];const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
 $('roll').onclick=()=>{if(paused)return;const now=performance.now();if(state.speed){if(now-lastBoost<3000)return;lastBoost=now;cycle+=.5;}else{if(now-lastManual<1100)return;lastManual=now;perform();}render();};$('burst').onclick=()=>{if(!paused){burst();render();}};$('compress').onclick=()=>{if(!paused&&Factory.compress(state)){toast('压缩完成 ◈ +'+Factory.compressionYield(state));render();save();}};
 document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;const data=button.dataset;if(data.upgradePage){if(tab==='production')productionPage=(productionPage+Number(data.upgradePage)+2)%2;else logisticsPage=(logisticsPage+Number(data.upgradePage)+2)%2;renderPanel();return;}if(data.tab){tab=data.tab;document.querySelectorAll('[data-tab]').forEach(entry=>entry.classList.toggle('active',entry.dataset.tab===tab));renderPanel();return;}if(data.help){help();return;}if(data.helpPage){helpPage=(helpPage+Number(data.helpPage)+4)%4;help();return;}if(data.export){const url=URL.createObjectURL(new Blob([JSON.stringify({...state,savedAt:Date.now()},null,2)],{type:'application/json'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='dice-factory-v2.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}if(data.import){$('file').click();return;}if(data.low){state.low=!state.low;document.body.classList.toggle('low',state.low);help();save();return;}if(paused)return;if(data.editDie!==undefined){const index=Number(data.editDie);if(!Number.isInteger(index)||index<0||index>=state.count)return;selectedDie=index;selectedFace=0;editor();return;}if(data.diePage){selectedDie=(selectedDie+Number(data.diePage)+state.count)%state.count;renderPanel();return;}if(data.faceIndex!==undefined){const index=Number(data.faceIndex);if(!Number.isInteger(index)||index<0||index>5)return;selectedFace=index;editor();return;}if(data.mod){if(Factory.modify(state,selectedDie,selectedFace,data.mod)){values=Array(state.count).fill(1);drawDice();editor();save();toast('改造完成');}else{editor();toast('资金不足或改造位已满');}return;}if(data.device){if(Factory.device(state,data.device)){save();renderPanel();}else toast('设备槽已满，请先卸下');return;}if(data.page){researchPage=(researchPage+Number(data.page)+12)%12;renderPanel();return;}if(data.buy&&Factory.buy(state,data.buy)){drawDice();toast('升级完成');}if(data.study!==undefined&&Factory.study(state,Number(data.study)))toast('研究完成');if(data.protocol){protocolDialog();return;}if(data.selectMode&&Factory.setMode(state,data.selectMode)){protocolDialog();toast(Factory.protocols[state.mode].name+'协议已激活');}if(data.claim&&Factory.claim(state))toast('订单完成');if(data.rebirth){rebirthDialog();return;}if(data.confirmRebirth){const next=Factory.rebirth(state);if(next){state=next;cycle=0;burstUntil=0;token++;clearTimeout(visualTimer);particles=[];links=[];floats=[];values=[1];drawDice();close();toast('新一代开始');}}if(data.migrate){if(!migrationPending)return;let legacy;try{legacy=JSON.parse(oldRaw);if(legacy.version!==1||!Number.isFinite(legacy.total)||legacy.total<0)throw Error();localStorage.setItem('dice-engine-v1-backup',oldRaw);}catch{toast('旧档无法验证，未迁移');return;}state.legacy=true;const grant=Math.min(8,Math.floor(Math.log10(1+legacy.total)));state.cores+=grant;state.coreTotal+=grant;close();toast('旧档保留 · ◈ +'+grant);}if(data.fresh){close();}render();save();});
 $('file').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>50000)throw Error();const candidate=Factory.validate(JSON.parse(await file.text()));if(!confirm('覆盖当前新版进度？'))return;state=candidate;blocked=false;state.savedAt=Date.now();cycle=0;burstUntil=0;values=Array(state.count).fill(1);token++;drawDice();document.body.classList.toggle('low',state.low);close();save();render();toast('导入完成');}catch{toast('存档无效，未修改进度');}finally{event.target.value='';}};
 document.addEventListener('visibilitychange',()=>{if(document.hidden){burstUntil=0;cycle=0;token++;clearTimeout(visualTimer);save();}else if(!paused){const result=Factory.offline(state);clock=performance.now();render();save();if(result.amount>1)toast('离线回收 +'+fmt(result.amount));}});window.addEventListener('pagehide',save);window.addEventListener('storage',event=>{if(event.key!==storageKey||!event.newValue)return;try{const remote=JSON.parse(event.newValue);if(remote.session&&remote.session!==session){paused=true;render();toast('另一页面接管了存档');}}catch{}});
 document.body.classList.toggle('low',state.low);drawDice();resize();render();if(oldRaw&&!blocked){open('新版经济迁移','<p>旧余额不带入新版，避免数十亿点数跳过成长。保留旧存档，按旧累计产出兑换最多8晶核。</p><p>也可以不兑换，从零体验。旧版文件 backup-v1.html 可继续使用旧存档。</p><div class="controls"><button data-migrate="1">兑换纪念</button><button data-fresh="1">从零开始</button></div>');}else{save();if(offline.amount>1)toast('离线回收 +'+fmt(offline.amount));}requestAnimationFrame(loop);
})();
</script></body></html>
